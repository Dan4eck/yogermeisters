<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yogermeisters — пять вариантов карточки ретрита</title>
  <style>
    @font-face { font-family: Inter; src: url('/assets/landing-v3/fonts/InterVariable.woff2'); font-weight: 100 900; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2efe7; color: #171918; font-family: Inter, Arial, sans-serif; }
    header { max-width: 1160px; margin: auto; padding: 36px 24px 24px; }
    .overline { margin: 0 0 14px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 42px); font-weight: 650; letter-spacing: -.06em; }
    .intro { max-width: 760px; margin: 14px 0 0; font-size: 13px; line-height: 1.6; color: #5c5956; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 20px; font-size: 12px; }
    button { font: inherit; border: 1px solid #17191835; border-radius: 24px; padding: 9px 14px; color: inherit; background: transparent; cursor: pointer; }
    button[aria-pressed='true'] { background: #171918; border-color: #171918; color: #f2efe7; }
    .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; max-width: 1160px; margin: auto; padding: 0 24px 36px; }
    figure { margin: 0; min-width: 0; }
    .label { display: flex; align-items: center; gap: 8px; min-height: 36px; margin-bottom: 12px; font-size: 12px; font-weight: 550; }
    .label span { color: #712f43; font-size: 10px; font-variant-numeric: tabular-nums; }
    .mount { padding: 12px; background: #712f43; border-radius: 22px; }
    .card { position: relative; height: 520px; overflow: hidden; isolation: isolate; border-radius: 13px; color: #f2efe7; background: #253c3a; }
    .card img { position: absolute; z-index: -3; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
    .card::before { content: ''; position: absolute; z-index: -2; inset: 0; background: linear-gradient(90deg, #0c100fa8, transparent 85%), linear-gradient(180deg, #0c100f85, transparent 38%, #0c100fc9); }
    .title { position: absolute; z-index: 2; top: 18px; left: 14px; margin: 0; writing-mode: vertical-rl; text-orientation: mixed; white-space: nowrap; font-size: 26px; font-weight: 500; line-height: 1; letter-spacing: -.035em; }
    .status { margin-inline-start: 16px; font-size: 10px; line-height: 1; font-weight: 450; letter-spacing: .015em; vertical-align: baseline; opacity: .85; }
    .status b { font-size: 13px; font-weight: 400; }
    .date, .price, .year { position: absolute; margin: 0; font-variant-numeric: tabular-nums; }
    .price { font-size: 27px; font-weight: 550; letter-spacing: -.055em; }
    .date { font-size: 11px; line-height: 1.5; }
    .year { font-size: 10px; letter-spacing: .08em; }
    figcaption { margin-top: 14px; font-size: 12px; line-height: 1.5; color: #5c5956; }
    .one .date { top: 20px; right: 14px; writing-mode: vertical-rl; letter-spacing: .03em; }
    .one .price { right: 14px; bottom: 20px; }
    .one .year { right: 16px; bottom: 59px; opacity: .75; }
    .one .line { position: absolute; bottom: 95px; right: 14px; width: 34px; height: 1px; background: #f2efe780; }
    .two .ticket { position: absolute; inset: auto 0 0; padding: 17px 14px 16px; color: #171918; background: #f2efe7; border-top: 1px dashed #17191860; }
    .two .ticket::before, .two .ticket::after { content: ''; position: absolute; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: #712f43; }
    .two .ticket::before { left: -7px; } .two .ticket::after { right: -7px; }
    .two .price, .two .date { position: static; }
    .two .date { margin-top: 8px; font-size: 10px; }
    .two .year { top: 20px; right: 13px; }
    .three .date { top: 21px; right: 12px; text-align: right; font-size: 10px; }
    .three .date strong { display: block; font-size: 19px; font-weight: 500; letter-spacing: -.04em; }
    .three .stamp { position: absolute; right: 12px; bottom: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 91px; height: 91px; border-radius: 50%; background: #f2efe7; color: #712f43; transform: rotate(-10deg); }
    .three .stamp .price { position: static; font-size: 23px; }
    .three .stamp .year { position: static; font-size: 9px; }
    .four .date { right: 13px; text-align: center; }
    .four .date strong { display: block; font-size: 25px; font-weight: 500; line-height: 1.05; letter-spacing: -.05em; }
    .four .date span { font-size: 9px; letter-spacing: .09em; }
    .four .start { top: 24px; } .four .end { top: 280px; }
    .four .route { position: absolute; top: 86px; right: 28px; width: 1px; height: 173px; background: #f2efe760; }
    .four .route::before, .four .route::after { content: ''; position: absolute; left: -2px; width: 5px; height: 5px; background: #f2efe7; border-radius: 50%; }
    .four .route::after { bottom: 0; }
    .four .price { left: 14px; bottom: 20px; }
    .four .year { right: 14px; bottom: 57px; }
    .five .price { top: 18px; right: 11px; writing-mode: vertical-rl; font-size: 22px; }
    .five .ribbon { position: absolute; left: -14px; bottom: 41px; width: calc(100% + 28px); padding: 12px 10px; background: #f2efe7; color: #712f43; transform: rotate(-11deg); text-align: center; }
    .five .date { position: static; font-size: 11px; font-weight: 500; }
    .five .year { bottom: 16px; right: 13px; }
    body.compact .board { max-width: 900px; gap: 14px; }
    body.compact .mount { padding: 8px; }
    body.compact .title { font-size: 24px; left: 12px; }
    button:focus-visible { outline: 2px solid #712f43; outline-offset: 3px; }
    @media (max-width: 1000px) {
      .board, body.compact .board { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; max-width: 700px; }
    }
    @media (max-width: 600px) {
      header { padding: 24px 16px; }
      .board, body.compact .board { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0 12px 32px; gap: 20px 12px; }
      .mount { padding: 0; }
      .card { height: 520px; }
      .label { font-size: 11px; }
      .title { font-size: 24px; left: 12px; }
      .controls { display: none; }
    }
    @media (max-width: 360px) {
      .title { font-size: 22px; left: 10px; }
      .status { font-size: 9px; }
      .three .stamp { width: 78px; height: 78px; right: 9px; }
      .three .date { right: 9px; }
      .three .date strong { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <p class="overline">Yogermeisters / карточки ретритов</p>
    <h1>Пять способов расставить акценты</h1>
    <p class="intro">Название слева. Пометка «Запись ×» продолжает ту же вертикальную строку. В примерах показан закрытый статус для сравнения оформления; реальная запись на Шри-Ланку остаётся открытой.</p>
    <div class="controls"><span>Ширина карточек:</span><button type="button" aria-pressed="true" data-size="normal">Обычный телефон</button><button type="button" aria-pressed="false" data-size="compact">Маленький телефон</button></div>
  </header>
  <main class="board" aria-label="Пять вариантов карточки Шри-Ланки">
    <figure>
      <div class="label"><span>01</span> Тихая рамка</div>
      <div class="mount"><article class="card one" aria-label="Вариант 1: Тихая рамка">
        <img src="/assets/retreats/sri-lanka/coast.webp" alt="Побережье Шри-Ланки с пальмами" />
        <h2 class="title">Йога-тур на Шри-Ланке <span class="status">Запись <b>×</b></span></h2>
        <p class="date">24 февраля — 3 марта</p><i class="line" aria-hidden="true"></i><p class="year">2027</p><p class="price">€1450</p>
      </article></div>
      <figcaption>Даты вдоль правого края. Цена внизу. Самый спокойный, много открытой фотографии.</figcaption>
    </figure>
    <figure>
      <div class="label"><span>02</span> Билет к океану</div>
      <div class="mount"><article class="card two" aria-label="Вариант 2: Билет к океану">
        <img src="/assets/retreats/sri-lanka/coast.webp" alt="Побережье Шри-Ланки с пальмами" />
        <h2 class="title">Йога-тур на Шри-Ланке <span class="status">Запись <b>×</b></span></h2>
        <p class="year">2027</p><div class="ticket"><p class="price">€1450</p><p class="date">24 февраля — 3 марта</p></div>
      </article></div>
      <figcaption>Светлый корешок билета. Даты и цена собраны вместе и легко читаются.</figcaption>
    </figure>
    <figure>
      <div class="label"><span>03</span> Почтовая марка</div>
      <div class="mount"><article class="card three" aria-label="Вариант 3: Почтовая марка">
        <img src="/assets/retreats/sri-lanka/coast.webp" alt="Побережье Шри-Ланки с пальмами" />
        <h2 class="title">Йога-тур на Шри-Ланке <span class="status">Запись <b>×</b></span></h2>
        <p class="date"><strong>24.02</strong>—<strong>03.03</strong></p><div class="stamp"><p class="year">2027</p><p class="price">€1450</p></div>
      </article></div>
      <figcaption>Даты в верхнем углу, цена на круглой печати. Чуть игривее, как открытка из путешествия.</figcaption>
    </figure>
    <figure>
      <div class="label"><span>04</span> Линия путешествия</div>
      <div class="mount"><article class="card four" aria-label="Вариант 4: Линия путешествия">
        <img src="/assets/retreats/sri-lanka/coast.webp" alt="Побережье Шри-Ланки с пальмами" />
        <h2 class="title">Йога-тур на Шри-Ланке <span class="status">Запись <b>×</b></span></h2>
        <p class="date start"><strong>24</strong><span>ФЕВ</span></p><i class="route" aria-hidden="true"></i><p class="date end"><strong>03</strong><span>МАР</span></p><p class="year">2027</p><p class="price">€1450</p>
      </article></div>
      <figcaption>Начало и конец поездки связаны тонкой линией. Даты становятся частью композиции.</figcaption>
    </figure>
    <figure>
      <div class="label"><span>05</span> Путевой ярлык</div>
      <div class="mount"><article class="card five" aria-label="Вариант 5: Путевой ярлык">
        <img src="/assets/retreats/sri-lanka/coast.webp" alt="Побережье Шри-Ланки с пальмами" />
        <h2 class="title">Йога-тур на Шри-Ланке <span class="status">Запись <b>×</b></span></h2>
        <p class="price">€1450</p><div class="ribbon"><p class="date">24 февраля — 3 марта</p></div><p class="year">2027</p>
      </article></div>
      <figcaption>Цена вдоль правого края, даты на наклонной ленте. Самый выразительный вариант.</figcaption>
    </figure>
  </main>
  <script>
    document.querySelectorAll('[data-size]').forEach(button => {
      button.addEventListener('click', () => {
        document.body.classList.toggle('compact', button.dataset.size === 'compact');
        document.querySelectorAll('[data-size]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      });
    });
  </script>
</body>
</html>
